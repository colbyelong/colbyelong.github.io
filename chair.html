<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Remaining as Chair</title>
<style>
:root{--text:#252525;--muted:#5f6368;--accent:#315f7d;--accent-dark:#23485f;--background:#fff;--surface:#f5f7f8;--border:#dfe3e6;--max-width:1050px}*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--background);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6}a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-dark);text-decoration:underline}.site-header{border-bottom:1px solid var(--border);background:var(--background)}.header-inner{max-width:var(--max-width);margin:0 auto;padding:1.8rem 2rem 1.25rem}.site-title{margin:0 0 1rem;font-family:Georgia,"Times New Roman",serif;font-size:2rem;font-weight:400;letter-spacing:-.02em}.site-nav{display:flex;flex-wrap:wrap;gap:.35rem 1.5rem;font-size:.96rem}.site-nav a{color:var(--muted)}.site-nav a:hover{color:var(--accent)}main{max-width:var(--max-width);margin:0 auto;padding:4rem 2rem 5rem}.countdown-section{text-align:center;padding:2rem 0 3rem}.countdown-heading{margin:0 0 2.5rem;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:400;line-height:1.2}.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.25rem;max-width:900px;margin:0 auto}.time-unit{padding:2rem 1rem 1.6rem;background:var(--surface);border:1px solid var(--border);border-radius:10px}.number{display:block;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.8rem,8vw,5.5rem);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}.label{display:block;margin-top:.8rem;color:var(--muted);font-size:1rem;text-transform:uppercase;letter-spacing:.12em}.deadline{margin:2.5rem 0 0;color:var(--muted);font-size:.95rem}.site-footer{max-width:var(--max-width);margin:0 auto;padding:1.5rem 2rem 2.5rem;border-top:1px solid var(--border);color:var(--muted);font-size:.88rem;text-align:center}@media(max-width:650px){.header-inner,main,.site-footer{padding-left:1.25rem;padding-right:1.25rem}.header-inner{padding-top:1.4rem}main{padding-top:2.5rem}.countdown{grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}.time-unit{padding:1.5rem .75rem 1.25rem}}
</style></head>
<body>
<header class="site-header"><div class="header-inner"><h1 class="site-title">Colby Long</h1><nav class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="Research.html">Research</a><a href="Colby Long_CV.pdf">CV</a><a href="AboutMe.html">About Me</a></nav></div></header>
<main><section class="countdown-section"><h2 class="countdown-heading">Time Remaining as Chair:</h2><div class="countdown" aria-live="polite"><div class="time-unit"><span class="number" id="days">--</span><span class="label">Days</span></div><div class="time-unit"><span class="number" id="hours">--</span><span class="label">Hours</span></div><div class="time-unit"><span class="number" id="minutes">--</span><span class="label">Minutes</span></div><div class="time-unit"><span class="number" id="seconds">--</span><span class="label">Seconds</span></div></div><p class="deadline">Countdown to midnight on July 30, 2029.</p></section></main>
<footer class="site-footer">&copy; Colby Long</footer>
<script>
const deadline=new Date(2029,6,31,0,0,0);
function updateCountdown(){let r=Math.max(0,deadline-Date.now()),s=Math.floor(r/1000);document.getElementById('days').textContent=Math.floor(s/86400);document.getElementById('hours').textContent=String(Math.floor(s%86400/3600)).padStart(2,'0');document.getElementById('minutes').textContent=String(Math.floor(s%3600/60)).padStart(2,'0');document.getElementById('seconds').textContent=String(s%60).padStart(2,'0')}
updateCountdown();setInterval(updateCountdown,1000);
</script></body></html>
